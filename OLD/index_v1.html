function fmt(v) {
  return v.toLocaleString("pt-PT", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " EUR";
}
function fmtK(v) {
  return v >= 10000 ? (v / 1000).toFixed(1) + "k" : fmt(v);

  );
}

function Card(props) {
  var s = Object.assign({
    background: T.ink2, border: "1px solid " + T.grey, borderRadius: 0, padding: "24px 20px"
  }, props.style || {});
  if (props.signal) { s.borderLeft = "3px solid " + T.signal; }
  return <div style={s}>{props.children}</div>;
}

function MiniChart(props) {
  var data = props.data;
  var color = props.color;
  var label = props.label;
  var height = props.height || 56;
  if (!data || data.length < 2) return null;
  var min = Math.min.apply(null, data) * 0.95;
  var max = Math.max.apply(null, data) * 1.05;
  var range = max - min || 1;
  var w = 100;
  var pts = data.map(function(v, i) {
    return (i / (data.length - 1)) * w + "," + (height - ((v - min) / range) * height);
  }).join(" ");
  var area = pts + " " + w + "," + height + " 0," + height;
  var diff = data[data.length - 1] - data[0];
  var pct = data[0] > 0 ? ((diff / data[0]) * 100).toFixed(1) : "0";

  return (
    <div style={{ marginBottom: 16 }}>
      {label && (
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 8 }}>
          <span style={{ fontSize: 13, fontWeight: 500 }}>{label}</span>
          <div>
            <span style={{ fontFamily: T.mono, fontSize: 13, fontWeight: 500 }}>{fmt(data[data.length - 1])}</span>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: diff >= 0 ? T.success : T.signal, marginLeft: 8 }}>{diff >= 0 ? "+" : ""}{pct}%</span>
          </div>
        </div>
      )}
      <svg viewBox={"0 0 " + w + " " + height} style={{ width: "100%", height: height }}>
        <polygon points={area} fill={color} fillOpacity="0.1" />
        <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" />

          return <span key={i} style={{ fontFamily: T.mono, fontSize: 9, color: T.grey3 }}>{h.label}</span>;
        })}
      </div>
    </div>
  );
}

                </button>
                {xCat === cat && (
                  <div style={{ background: T.ink2, border: "1px solid " + T.grey, borderTop: "none" }}>
                    {items.map(function(it, i) {
                      return (
                        <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "12px 20px", borderTop: "1px solid " + T.grey }}>
                          <div>
                            <div style={{ fontSize: 13, fontWeight: 600 }}>{it.bank}</div>
                            <div style={{ fontSize: 12, color: T.grey2 }}>{it.type}</div>
                          </div>
                          <div style={{ fontFamily: T.mono, fontSize: 14 }}>{fmt(it.value)}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {/* CHARTS */}
      {tab === "charts" && (
        <div style={{ padding: "0 20px 40px" }}>
          <Card style={{ marginBottom: 12 }}>
            <Label style={{ marginBottom: 16 }}>EVOLUCAO PATRIMONIAL</Label>
            <MiniChart data={history.map(function(h) { return h.liquidez + h.poupanca + h.investimentos; })} color={T.success} label="Ativos Totais" />
            <MiniChart data={history.map(function(h) { return (h.liquidez + h.poupanca + h.investimentos) - h.divida; })} color={T.paper} label="Patrimonio Liquido" />
          </Card>
          <Card style={{ marginBottom: 12 }}>
            <Label style={{ marginBottom: 16 }}>INVESTIMENTOS</Label>
            <MiniChart data={history.map(function(h) { return h.xtbPlans; })} color={T.success} label="XTB Planos" />
            <MiniChart data={history.map(function(h) { return h.xtbTrans; })} color="#F59E0B" label="XTB Transacoes" />
            <MiniChart data={history.map(function(h) { return h.trCorr; })} color="#3B82F6" label="TR Corretagem" />
          </Card>
          <Card>
            <Label style={{ marginBottom: 16 }}>DESPESAS MENSAIS</Label>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 8, height: 120 }}>
              {months.map(function(m, i) {
                var total = Object.values(D.byCategory).reduce(function(s, v) { return s + (v[i] || 0); }, 0);
                var h = Math.max((total / 2200) * 100, 4);
                return (
                  <div key={i} style={{ flex: 1, textAlign: "center" }}>
                    <div style={{ fontFamily: T.mono, fontSize: 10, marginBottom: 4, color: i === 3 ? T.signal : T.paper }}>{fmtK(total)}</div>
                    <div style={{ height: h + "%", background: i === 3 ? T.signal : T.paper, opacity: i === 3 ? 1 : 0.15 }} />
                    <div style={{ fontFamily: T.mono, fontSize: 9, color: T.grey2, marginTop: 6, letterSpacing: "0.1em" }}>{m}</div>
                  </div>
                );
              })}
            </div>
          </Card>
        </div>
      )}

      {/* EXPENSES */}
      {tab === "expenses" && (
        <div style={{ padding: "0 20px 100px" }}>
          <div style={{ display: "flex", marginBottom: 16, border: "1px solid " + T.grey }}>
            {months.map(function(m, i) {
              return (
                <button key={i} onClick={function() { setEM(i); setXExp(null); }}
                  style={{ flex: 1, padding: "10px 0", border: "none", borderRight: i < 3 ? "1px solid " + T.grey : "none", fontFamily: T.mono, fontSize: 10, fontWeight: 500, letterSpacing: "0.1em", cursor: "pointer", background: eM === i ? T.paper : "transparent", color: eM === i ? T.ink : T.grey2 }}>
                  {m}
                </button>
              );
            })}
            <button onClick={function() { setEM(4); setXExp(null); }}
              style={{ flex: 1, padding: "10px 0", border: "none", borderLeft: "1px solid " + T.grey, fontFamily: T.mono, fontSize: 10, letterSpacing: "0.1em", cursor: "pointer", background: eM === 4 ? T.paper : "transparent", color: eM === 4 ? T.ink : T.grey2 }}>
              Q1
            </button>
          </div>

          <Card style={{ marginBottom: 16 }}>
            <Label>{isQ1 ? "DESPESAS Q1" : "DESPESAS " + months[eM]}</Label>
            <div style={{ fontSize: 24, fontWeight: 900, marginTop: 4, fontFamily: T.mono }}>{fmt(totalExpMonth)}</div>
            {eM === 3 && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10 }}>
                <SvgIcon paths={iconPaths.alert} size={12} color={T.signal} />
                <span style={{ fontFamily: T.mono, fontSize: 10, color: T.signal }}>ABRIL PARCIAL</span>
              </div>
            )}
          </Card>

          {expRows.map(function(r) {
            var isExp = xExp === r.id;
            var over = r.pct > 100;
            var barColor = over ? T.signal : r.pct > 75 ? "#F59E0B" : T.paper;
            return (
              <div key={r.id} style={{ marginBottom: 4 }}>
                <button onClick={function() { setXExp(isExp ? null : r.id); }}
                  style={{ width: "100%", display: "flex", alignItems: "center", background: T.ink2, border: "1px solid " + T.grey, borderRadius: 0, padding: "12px 16px", cursor: "pointer", color: T.paper }}>
                  <span style={{ marginRight: 12 }}><CatIcon id={r.id} size={16} color={T.grey2} /></span>
                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <span style={{ fontSize: 13, fontWeight: 600 }}>{r.name}</span>
                      <div>
                        <span style={{ fontFamily: T.mono, fontSize: 13, fontWeight: 600 }}>{fmt(r.value)}</span>
                        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.grey3, marginLeft: 4 }}>/ {fmt(r.limit)}</span>
                      </div>
                    </div>
                    <div style={{ marginTop: 6, height: 3, background: T.grey }}>
                      <div style={{ height: "100%", width: Math.min(r.pct, 100) + "%", background: barColor, opacity: over ? 1 : 0.6 }} />
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", marginTop: 4 }}>
                      <span style={{ fontFamily: T.mono, fontSize: 10, color: over ? T.signal : T.grey2 }}>{r.pct.toFixed(0)}%</span>
                      {over
                        ? <span style={{ fontFamily: T.mono, fontSize: 10, color: T.signal }}>+{fmt(r.value - r.limit)}</span>
                        : <span style={{ fontFamily: T.mono, fontSize: 10, color: T.success }}>Resta {fmt(r.limit - r.value)}</span>
                      }
                    </div>
                  </div>
                </button>
                {isExp && (function() {
                  var txnData = D.transactions[r.id];
                  var mt = (!isQ1 && txnData && txnData[eM]) ? txnData[eM] : [];
                  return (
                    <div style={{ background: T.ink2, border: "1px solid " + T.grey, borderTop: "none", padding: "12px 16px" }}>
                      {mt.length > 0 && (
                        <div style={{ marginBottom: 12 }}>
                          {mt.map(function(item, ti) {
                            return (
                              <div key={ti} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderTop: ti > 0 ? "1px solid " + T.grey : "none" }}>
                                <span style={{ fontSize: 12, color: T.paper2 }}>{item[0]}</span>
                                <span style={{ fontFamily: T.mono, fontSize: 12 }}>{fmt(item[1])}</span>
                              </div>
                            );
                          })}
                        </div>
                      )}
                      <div style={{ display: "flex", gap: 8, paddingTop: 10, borderTop: "1px solid " + T.grey }}>
                        {months.map(function(m, mi) {
                          var v = r.vals[mi] || 0;
                          return (
                            <div key={mi} style={{ flex: 1, textAlign: "center" }}>
                              <Label style={{ fontSize: 9 }}>{m}</Label>
                              <div style={{ fontFamily: T.mono, fontSize: 11, marginTop: 2, color: mi === eM ? T.paper : T.grey3 }}>{fmt(v)}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}
              </div>
            );
          })}

          <button onClick={function() { setShowF(true); }}
            style={{ position: "fixed", bottom: 24, right: 24, width: 48, height: 48, border: "1px solid " + T.paper, background: T.ink, color: T.paper, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, borderRadius: 0 }}>
            <SvgIcon paths={iconPaths.plus} size={20} />
          </button>
        </div>
      )}

      {/* ADD FORM */}
      {showF && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.8)", zIndex: 100, display: "flex", flexDirection: "column", justifyContent: "flex-end" }}>
          <div style={{ background: T.ink2, borderTop: "1px solid " + T.grey, padding: "24px 20px 32px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 24 }}>
              <div style={{ fontSize: 16, fontWeight: 700, textTransform: "uppercase" }}>ADICIONAR DESPESA</div>
              <button onClick={function() { setShowF(false); }} style={{ background: "none", border: "none", color: T.grey2, cursor: "pointer" }}>
                <SvgIcon paths={iconPaths.x} size={20} />
              </button>
            </div>
            <div style={{ marginBottom: 16 }}>
              <Label style={{ marginBottom: 6 }}>CATEGORIA</Label>
              <select value={fd.category} onChange={function(e) { setFd(Object.assign({}, fd, { category: e.target.value })); }}
                style={{ width: "100%", padding: "12px 16px", border: "1px solid " + T.grey, background: T.ink2, color: T.paper, fontSize: 14, borderRadius: 0 }}>
                {D.budget.map(function(b) { return <option key={b.id} value={b.id}>{b.name}</option>; })}
              </select>
            </div>
            <div style={{ marginBottom: 16 }}>
              <Label style={{ marginBottom: 6 }}>DESCRICAO</Label>
              <input value={fd.desc} onChange={function(e) { setFd(Object.assign({}, fd, { desc: e.target.value })); }}
                placeholder="Ex: Pingo Doce" style={{ width: "100%", padding: "12px 16px", border: "1px solid " + T.grey, background: T.ink2, color: T.paper, fontSize: 15, borderRadius: 0, boxSizing: "border-box" }} />
            </div>
            <div style={{ marginBottom: 16 }}>
              <Label style={{ marginBottom: 6 }}>VALOR (EUR)</Label>
              <input value={fd.amount} onChange={function(e) { setFd(Object.assign({}, fd, { amount: e.target.value })); }}
                placeholder="0,00" inputMode="decimal" style={{ width: "100%", padding: "12px 16px", border: "1px solid " + T.grey, background: T.ink2, color: T.paper, fontFamily: T.mono, fontSize: 18, fontWeight: 600, borderRadius: 0, boxSizing: "border-box" }} />
            </div>
            <button onClick={addExp} disabled={!fd.desc || !fd.amount}
              style={{ width: "100%", padding: "14px 0", border: fd.desc && fd.amount ? "1px solid " + T.paper : "1px solid " + T.grey, background: fd.desc && fd.amount ? T.ink : "transparent", color: fd.desc && fd.amount ? T.paper : T.grey3, fontSize: 13, fontWeight: 700, letterSpacing: "0.05em", textTransform: "uppercase", cursor: "pointer", borderRadius: 0 }}>
              ADICIONAR DESPESA
            </button>
          </div>
        </div>
      )}

      {/* INSIGHTS */}
      {tab === "insights" && (
        <div style={{ padding: "0 20px 40px" }}>
          <Card style={{ marginBottom: 12 }}>
            <Label style={{ marginBottom: 16 }}>CORTES SUGERIDOS</Label>
            <div style={{ fontFamily: T.mono, fontSize: 12, color: T.success, marginBottom: 16 }}>Poupanca potencial: -{fmt(potSav)}/mes</div>
            {overB.map(function(c, i) {
              return (
                <div key={c.id} style={{ padding: "12px 0", borderTop: "1px solid " + T.grey }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                    <span style={{ fontSize: 13, fontWeight: 600 }}>{c.name}</span>
                    <span style={{ fontFamily: T.mono, fontSize: 12, color: T.signal }}>+{fmt(c.diff)}/mes</span>
                  </div>
                  <div style={{ fontSize: 12, color: T.grey2 }}>
                    {c.id === "restauracao" ? "Trocar 2 refeicoes fora/semana por cozinhar." : c.id === "super" ? "Lista semanal. Marcas brancas. Promocoes." : "Rever limite ou reduzir."}
                  </div>
                </div>
              );
            })}
          </Card>
          <Card>
            <Label style={{ marginBottom: 16 }}>CENARIOS 5 ANOS</Label>
            {[{ l: "SEM MUDANCAS", m: 550, r: 0.07 }, { l: "COM OTIMIZACAO", m: 750, r: 0.08 }, { l: "AGRESSIVO", m: 1000, r: 0.09 }].map(function(s, i) {
              var v = totalInv;
              for (var m = 0; m < 60; m++) v = v * (1 + s.r / 12) + s.m;
              return (
                <div key={i} style={{ padding: "12px 0", borderTop: "1px solid " + T.grey, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div>
                    <Label>{s.l}</Label>
                    <div style={{ fontFamily: T.mono, fontSize: 11, color: T.grey3, marginTop: 2 }}>{fmt(s.m)}/mes</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontSize: 20, fontWeight: 900 }}>{fmtK(v)}</div>
                    <div style={{ fontFamily: T.mono, fontSize: 10, color: T.success }}>+{fmtK(v - totalInv)}</div>
                  </div>
                </div>
              );
            })}
          </Card>
        </div>
      )}

      {/* LOAN */}
      {tab === "loan" && (
        <div style={{ padding: "0 20px 40px" }}>
          <Card signal={true} style={{ marginBottom: 12 }}>
            <Label style={{ marginBottom: 6 }}>CREDITO HABITACAO</Label>
            <div style={{ fontSize: 13, color: T.grey2, marginBottom: 16 }}>Bankinter / Taxa Fixa 2,7%</div>
            <div style={{ marginBottom: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontFamily: T.mono, fontSize: 11, color: T.grey2, marginBottom: 6 }}>
                <span>Pago: {fmt(90000 - 77865.69)}</span>
                <span>{pp.toFixed(1)}%</span>
              </div>
              <div style={{ height: 4, background: T.grey }}>
                <div style={{ height: "100%", width: pp + "%", background: T.success }} />
              </div>
            </div>
            <div style={{ fontSize: 28, fontWeight: 900, color: T.signal }}>{fmt(77865.69)}</div>
            <Label style={{ marginTop: 4 }}>CAPITAL EM DIVIDA</Label>
          </Card>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            {[["PRESTACAO", "485,83 EUR"], ["TAXA", "2,7%"], ["CAPITAL", "90 000 EUR"], ["PRAZO", "20 ANOS"]].map(function(pair, i) {
              return (
                <Card key={i} style={{ padding: "16px 20px" }}>
                  <Label style={{ marginBottom: 4 }}>{pair[0]}</Label>
                  <div style={{ fontSize: 15, fontWeight: 600 }}>{pair[1]}</div>
                </Card>
              );
            })}
          </div>
        </div>
      )}

      {/* FOOTER */}
      <div style={{ padding: "32px 20px 48px", borderTop: "1px solid " + T.grey }}>
        <div style={{ display: "flex", alignItems: "baseline", marginBottom: 4 }}>
          <span style={{ fontWeight: 900, fontSize: 14 }}>PROOF</span>
          <span style={{ fontWeight: 900, fontSize: 14, color: T.signal }}>.</span>
        </div>
        <div style={{ fontFamily: T.mono, fontSize: 9, color: T.grey3, letterSpacing: "0.1em" }}>CASE 001 / v0.4 / 2026.04.18</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
