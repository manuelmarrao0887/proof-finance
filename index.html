.card-s{background:var(--ink2);border:1px solid var(--grey);border-left:3px solid var(--signal);padding:24px 20px}

.row{display:flex;justify-content:space-between;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* ── UTILS ── */
function fm(v){return v.toLocaleString("pt-PT",{minimumFractionDigits:2,maximumFractionDigits:2})+" EUR";}
function fk(v){return v>=10000?(v/1000).toFixed(1)+"k":fm(v);}
function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

/* ── COMPUTED ── */
var grp={};accts.forEach(function(a){if(!grp[a.c])grp[a.c]=[];grp[a.c].push(a);});

/* ── SVG CHART ── */
function chart(data,color,label,ht){
  ht=ht||56;if(!data||data.length<2)return"";
  var mn=Math.min.apply(null,data)*0.95,mx=Math.max.apply(null,data)*1.05,rg=mx-mn||1,w=100;
  var pts=data.map(function(v,i){return(i/(data.length-1))*w+","+(ht-((v-mn)/rg)*ht);}).join(" ");
  var area=pts+" "+w+","+ht+" 0,"+ht;
  var df=data[data.length-1]-data[0],pc=data[0]>0?((df/data[0])*100).toFixed(1):"0";
  var dc=df>=0?"var(--success)":"var(--signal)";
  return '<div style="margin-bottom:16px">'
    +'<div class="row" style="margin-bottom:8px"><span style="font-size:13px;font-weight:500">'+esc(label)+'</span>'
    +'<div><span class="mono" style="font-size:13px;font-weight:500">'+fm(data[data.length-1])+'</span>'
    +'<span class="mono" style="font-size:11px;color:'+dc+';margin-left:8px">'+(df>=0?"+":"")+pc+'%</span></div></div>'
    +'<svg viewBox="0 0 '+w+' '+ht+'" style="width:100%;height:'+ht+'px"><defs><linearGradient id="g'+label.replace(/\s/g,"")+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.15"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<polygon points="'+area+'" fill="url(#g'+label.replace(/\s/g,'')+')"/>'
    +'<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>'
    +data.map(function(v,i){return'<circle cx="'+(i/(data.length-1))*w+'" cy="'+(ht-((v-mn)/rg)*ht)+'" r="2.5" fill="'+color+'" stroke="var(--ink)" stroke-width="1"/>';}).join("")
    +'</svg>'
    +'<div style="display:flex;justify-content:space-between;margin-top:4px">'+hist.map(function(x){return'<span class="mono" style="font-size:9px;color:var(--grey3)">'+x.l+'</span>';}).join("")+'</div></div>';
}

function renderExpenses(){
  var ms=["JAN","FEV","MAR","ABR"],isQ=S.em===4;
  var rows=bdg.map(function(b){
    var vs=byC[b.id]||[0,0,0,0];
    var val=isQ?vs[0]+vs[1]+vs[2]:vs[S.em];
    var lm=isQ?b.lm*3:b.lm;
    return{id:b.id,nm:b.nm,val:val,lm:lm,pct:lm>0?(val/lm)*100:0,vs:vs};
  }).filter(function(r){return r.val>0;}).sort(function(a,b){return b.val-a.val;});
  var tE=rows.reduce(function(s,r){return s+r.val;},0);

  var o='<div style="padding:0 20px 40px">';
  // Month selector
  o+='<div style="display:flex;margin-bottom:16px;border:1px solid var(--grey)">';
  ms.forEach(function(m,i){
    o+='<button onclick="set(\'em\','+i+');set(\'xExp\',null);" style="flex:1;padding:10px 0;border:none;'+(i<3?'border-right:1px solid var(--grey);':'')+'font-family:\'IBM Plex Mono\',monospace;font-size:10px;font-weight:500;letter-spacing:0.1em;background:'+(S.em===i?'var(--paper)':'transparent')+';color:'+(S.em===i?'var(--ink)':'var(--grey2)')+'">'+m+'</button>';
  });
  o+='<button onclick="set(\'em\',4);set(\'xExp\',null);" style="flex:1;padding:10px 0;border:none;border-left:1px solid var(--grey);font-family:\'IBM Plex Mono\',monospace;font-size:10px;font-weight:500;letter-spacing:0.1em;background:'+(S.em===4?'var(--paper)':'transparent')+';color:'+(S.em===4?'var(--ink)':'var(--grey2)')+'">Q1</button></div>';
  // Total
  o+='<div class="card" style="margin-bottom:16px"><div class="row"><div><div class="label">'+(isQ?'DESPESAS Q1':'DESPESAS '+ms[S.em])+'</div><div class="mono" style="font-size:24px;font-weight:900;margin-top:4px">'+fm(tE)+'</div></div>';
  if(!isQ&&S.em<3&&sal[S.em]){o+='<div style="text-align:right"><div class="label">SALARIO</div><div class="mono" style="font-size:18px;font-weight:700;color:var(--success);margin-top:4px">'+fm(sal[S.em])+'</div></div>';}
  o+='</div>';
  if(S.em===3)o+='<div style="display:flex;align-items:center;gap:6px;margin-top:10px"><span class="mono" style="font-size:10px;color:var(--signal)">ABRIL PARCIAL</span></div>';
  o+='</div>';
  // Rows
  rows.forEach(function(r){
    var isE=S.xExp===r.id,ov=r.pct>100;
    var bc=ov?'var(--signal)':r.pct>75?'#F59E0B':'var(--paper)';
    o+='<div style="margin-bottom:4px"><button onclick="set(\'xExp\','+(isE?'null':'\''+r.id+'\'')+');" style="width:100%;display:flex;background:var(--ink2);border:1px solid var(--grey);border-radius:0;padding:12px 16px;color:var(--paper);text-align:left"><div style="flex:1">';
    o+='<div class="row"><span style="font-size:13px;font-weight:600">'+esc(r.nm)+'</span><div><span class="mono" style="font-size:13px;font-weight:600">'+fm(r.val)+'</span><span class="mono" style="font-size:11px;color:var(--grey3);margin-left:4px">/ '+fm(r.lm)+'</span></div></div>';
    o+='<div style="margin-top:6px;height:3px;background:var(--grey)"><div style="height:100%;width:'+Math.min(r.pct,100)+'%;background:'+bc+';opacity:'+(ov?1:0.6)+'"></div></div>';
    o+='<div class="row" style="margin-top:4px"><span class="mono" style="font-size:10px;color:'+(ov?'var(--signal)':'var(--grey2)')+'">'+r.pct.toFixed(0)+'%</span>';
    o+=ov?'<span class="mono" style="font-size:10px;color:var(--signal)">+'+fm(r.val-r.lm)+'</span>':'<span class="mono" style="font-size:10px;color:var(--success)">Resta '+fm(r.lm-r.val)+'</span>';
    o+='</div></div></button>';
    if(isE&&txn[r.id]&&!isQ&&txn[r.id][S.em]){
      o+='<div style="background:var(--ink2);border:1px solid var(--grey);border-top:none;padding:12px 16px">';
      txn[r.id][S.em].forEach(function(t,i){
        o+='<div class="row" style="padding:6px 0;'+(i>0?'border-top:1px solid var(--grey)':'')+'"><span style="font-size:12px;color:var(--paper2)">'+esc(t[0])+'</span><span class="mono" style="font-size:12px;font-weight:500">'+fm(t[1])+'</span></div>';
      });
      o+='</div>';
    }
    o+='</div>';
  });
  o+='</div>';return o;
}

function renderLoan(){
  var o='<div style="padding:0 20px 40px">';
  o+='<div class="card-s" style="margin-bottom:12px"><div class="label" style="margin-bottom:6px">CREDITO HABITACAO</div><div style="font-size:13px;color:var(--grey2);margin-bottom:16px">Bankinter / Taxa Fixa</div>';
  o+='<div style="margin-bottom:16px"><div class="row mono" style="font-size:11px;color:var(--grey2);margin-bottom:6px"><span>Pago: '+fm(90000-77555.06)+'</span><span>'+pp.toFixed(1)+'%</span></div><div style="height:4px;background:var(--grey)"><div style="height:100%;width:'+pp+'%;background:var(--success)"></div></div></div>';
  o+='<div style="font-size:28px;font-weight:900;color:var(--signal)">'+fm(77555.06)+'</div><div class="label" style="margin-top:4px">CAPITAL EM DIVIDA</div></div>';
  o+='<div class="grid2">';
  [["PRESTACAO","485,83 EUR"],["PROXIMA","28.05.2026"],["TAXA","2,7%"],["TIPO","TAXA FIXA"],["CAPITAL","90 000 EUR"],["PRAZO","20 ANOS"]].forEach(function(x){
    o+='<div class="card" style="padding:16px 20px"><div class="label" style="margin-bottom:4px">'+x[0]+'</div><div style="font-size:15px;font-weight:600">'+x[1]+'</div></div>';
  });
  o+='</div></div>';return o;
}

/* ── RENDER ── */
function render(){
  var el=document.getElementById("app");
  if(S.view==="loading"){el.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center"><div class="label">A CARREGAR.</div></div>';return;}
  if(S.view==="login"){el.innerHTML=renderLogin();return;}
  el.innerHTML=renderApp();
}

/* ── AUTH ── */
function doLogin(){
  var e=document.getElementById("le").value;
  var p=document.getElementById("lp").value;
  if(!e||!p)return;
  document.getElementById("lerr").innerHTML='<div class="label" style="margin-bottom:16px">A AUTENTICAR.</div>';
  sb.auth.signInWithPassword({email:e,password:p}).then(function(res){
    if(res.error){document.getElementById("lerr").innerHTML='<div style="border-left:3px solid var(--signal);padding:10px;margin-bottom:16px"><div class="label" style="color:var(--signal)">'+esc(res.error.message)+'</div></div>';return;}
    session=res.data.session;S.view="app";render();
  });
}
function doLogout(){sb.auth.signOut().then(function(){session=null;S.view="login";render();});}

/* ── INIT ── */
render();
sb.auth.getSession().then(function(res){
  session=res.data.session;
  S.view=session?"app":"login";
  render();
});
sb.auth.onAuthStateChange(function(_,sess){session=sess;S.view=sess?"app":"login";render();});
</script>
</body>
</html>
