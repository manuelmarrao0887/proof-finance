    {(()=>{const b=D.budget.find(x=>x.id===fd.category);if(!b)return null;const cur=byC[b.id]?byC[b.id][3]:0;const nv=parseFloat((fd.amount||"0").replace(",","."))||0;const af=cur+nv;const p=(af/b.limit)*100;const ov=af>b.limit;return<div style={{border:`1px solid ${T.grey}`,padding:12,marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><Label>{b.name} EM ABRIL</Label><span style={{fontFamily:T.mono,fontSize:12,color:ov?T.signal:T.success}}>{fmt(af)} / {fmt(b.limit)}</span></div><div style={{height:3,background:T.grey}}><div style={{height:"100%",width:`${Math.min(p,100)}%`,background:ov?T.signal:T.paper}}/></div></div>;})()}
    <button onClick={addE} disabled={!fd.desc||!fd.amount} style={{width:"100%",padding:"14px 0",border:fd.desc&&fd.amount?`1px solid ${T.paper}`:`1px solid ${T.grey}`,background:fd.desc&&fd.amount?T.ink:"transparent",color:fd.desc&&fd.amount?T.paper:T.grey3,fontSize:13,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer",borderRadius:0}}>ADICIONAR DESPESA</button></div></div>}

    {/* SETTINGS */}
    {showSet&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}><div style={{background:T.ink2,borderTop:`1px solid ${T.grey}`,padding:"24px 20px 32px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}><div style={{fontSize:16,fontWeight:700,textTransform:"uppercase"}}>DEFINICOES</div><button onClick={()=>setShowSet(false)} style={{background:"none",border:"none",color:T.grey2,cursor:"pointer"}}><Ic d={ic.x} size={20}/></button></div>
    <Label style={{marginBottom:6}}>ANTHROPIC API KEY</Label><div style={{fontSize:12,color:T.grey3,marginBottom:12}}>Obtem em console.anthropic.com. Guardada no browser.</div>
    <div style={{display:"flex",gap:8,marginBottom:16}}><input value={keyIn} onChange={e=>setKeyIn(e.target.value)} type={showKey?"text":"password"} placeholder="sk-ant-..." style={{flex:1,padding:"12px 16px",border:`1px solid ${T.grey}`,background:T.ink,color:T.paper,fontFamily:T.mono,fontSize:13,borderRadius:0,boxSizing:"border-box"}}/><button onClick={()=>setShowKey(!showKey)} style={{padding:"0 12px",border:`1px solid ${T.grey}`,background:"transparent",color:T.grey2,fontFamily:T.mono,fontSize:10,letterSpacing:"0.1em",cursor:"pointer",borderRadius:0}}>{showKey?"OCULTAR":"MOSTRAR"}</button></div>
    {apiKey&&<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,padding:"10px 12px",borderLeft:`3px solid ${T.success}`}}><div style={{width:8,height:8,background:T.success}}/><Label style={{color:T.success}}>KEY CONFIGURADA</Label></div>}
    <button onClick={saveKey} disabled={!keyIn} style={{width:"100%",padding:"14px 0",border:keyIn?`1px solid ${T.paper}`:`1px solid ${T.grey}`,background:keyIn?T.ink:"transparent",color:keyIn?T.paper:T.grey3,fontSize:13,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer",borderRadius:0,marginBottom:12}}>GUARDAR KEY</button>
    {apiKey&&<button onClick={()=>{setKeyIn("");try{localStorage.removeItem("proof_api_key");}catch{}setApiKey("");}} style={{width:"100%",padding:"12px 0",border:`1px solid ${T.signal}30`,background:"transparent",color:T.signal,fontFamily:T.mono,fontSize:11,cursor:"pointer",borderRadius:0}}>REMOVER KEY</button>}
    </div></div>}

    {/* STATEMENT IMPORT */}
    {showStmt&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}}><div style={{background:T.ink2,borderTop:`1px solid ${T.grey}`,padding:"24px 20px 32px",maxHeight:"90vh",overflow:"auto"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}><div style={{fontSize:16,fontWeight:700,textTransform:"uppercase"}}>IMPORTAR EXTRACTO</div><button onClick={()=>{setShowStmt(false);setStR(null);}} style={{background:"none",border:"none",color:T.grey2,cursor:"pointer"}}><Ic d={ic.x} size={20}/></button></div>
    {!apiKey&&<div style={{borderLeft:`3px solid ${T.signal}`,padding:12,marginBottom:16}}><Label style={{color:T.signal}}>API KEY NECESSARIA</Label></div>}
    {apiKey&&!stR&&!stSc&&<><div style={{fontSize:12,color:T.grey2,marginBottom:16}}>Fotografa ou carrega imagem do extracto.</div><div style={{display:"flex",gap:8,marginBottom:16}}><input ref={stCR} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={e=>{if(e.target.files?.[0])handleStmt(e.target.files[0]);}}/><input ref={stFR} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{if(e.target.files?.[0])handleStmt(e.target.files[0]);}}/><button onClick={()=>stCR.current?.click()} style={{flex:1,padding:16,border:`1px solid ${T.grey}`,background:"transparent",color:T.paper,fontFamily:T.mono,fontSize:11,letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer",borderRadius:0,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><Ic d={ic.camera} size={24}/>CAMARA</button><button onClick={()=>stFR.current?.click()} style={{flex:1,padding:16,border:`1px solid ${T.grey}`,background:"transparent",color:T.paper,fontFamily:T.mono,fontSize:11,letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer",borderRadius:0,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}><Ic d={ic.image} size={24}/>GALERIA</button></div></>}
    {stSc&&<div style={{border:`1px solid ${T.grey}`,padding:24,textAlign:"center"}}><Label>A PROCESSAR EXTRACTO.</Label></div>}
    {stR?.error&&<div style={{borderLeft:`3px solid ${T.signal}`,padding:12,marginBottom:16}}><Label style={{color:T.signal}}>{stR.error}</Label></div>}
    {stR?.transactions&&<><div style={{display:"flex",justifyContent:"space-between",marginBottom:12}}><Label>{stR.bank||"EXTRACTO"} — {stR.transactions.length} TRANSACOES</Label></div><div style={{maxHeight:"40vh",overflow:"auto",marginBottom:16}}>{stR.transactions.map((t,i)=>{const sel=!!stSel[i];const isD=t.amount<0;const bI=D.budget.find(b=>b.id===t.category);return<button key={i} onClick={()=>setStSel(p=>{const n={...p};if(n[i])delete n[i];else n[i]=true;return n;})} style={{width:"100%",display:"flex",alignItems:"center",gap:12,padding:"10px 12px",border:`1px solid ${sel?T.paper:T.grey}`,borderTop:i>0?"none":undefined,background:sel?T.ink3:"transparent",color:T.paper,cursor:"pointer",borderRadius:0,textAlign:"left"}}><div style={{width:16,height:16,border:`1.5px solid ${sel?T.paper:T.grey}`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{sel&&<div style={{width:8,height:8,background:T.paper}}/>}</div><div style={{flex:1,minWidth:0}}><div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"60%"}}>{t.desc}</span><span style={{fontFamily:T.mono,fontSize:12,fontWeight:600,color:isD?T.paper:T.success}}>{isD?"-":"+"}{fmt(Math.abs(t.amount))}</span></div><div style={{display:"flex",gap:8,marginTop:3}}><span style={{fontFamily:T.mono,fontSize:10,color:T.grey3}}>{t.date}</span>{bI&&<span style={{fontFamily:T.mono,fontSize:10,color:T.grey2}}>{bI.name}</span>}</div></div></button>;})}</div><div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><Label>{Object.keys(stSel).length} SELECCIONADAS</Label><Label style={{color:T.paper}}>{fmt(stR.transactions.filter((_,i)=>stSel[i]).reduce((s,t)=>s+Math.abs(t.amount),0))}</Label></div><button onClick={importStmt} disabled={Object.keys(stSel).length===0} style={{width:"100%",padding:"14px 0",border:Object.keys(stSel).length>0?`1px solid ${T.paper}`:`1px solid ${T.grey}`,background:Object.keys(stSel).length>0?T.ink:"transparent",color:Object.keys(stSel).length>0?T.paper:T.grey3,fontSize:13,fontWeight:700,letterSpacing:"0.05em",textTransform:"uppercase",cursor:"pointer",borderRadius:0}}>IMPORTAR SELECCIONADAS</button></>}
    </div></div>}

    {/* INSIGHTS */}
    {tab==="insights"&&<div style={{padding:"0 20px 40px"}}><Card style={{marginBottom:12,textAlign:"center"}}><Label style={{marginBottom:12}}>SAUDE FINANCEIRA</Label><div style={{fontSize:56,fontWeight:900,color:sR>15?T.success:"#F59E0B"}}>{sR>15?"B+":sR>5?"C+":"D"}</div><div style={{fontFamily:T.mono,fontSize:12,color:T.grey2,marginTop:8}}>Poupanca {sR.toFixed(1)}% / Emergencia {eMo.toFixed(1)} meses</div></Card>
    <Card style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><div style={{display:"flex",alignItems:"center",gap:8}}><Ic d={ic.scissors} size={16}/><span style={{fontSize:14,fontWeight:700,textTransform:"uppercase"}}>CORTES</span></div><span style={{fontFamily:T.mono,fontSize:12,color:T.success}}>-{fmt(pS)}/mes</span></div>{oB.map((c,i)=><div key={c.id} style={{padding:"12px 0",borderTop:`1px solid ${T.grey}`}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:600}}>{c.name}</span><span style={{fontFamily:T.mono,fontSize:12,color:T.signal}}>+{fmt(c.diff)}/mes</span></div><div style={{fontSize:12,color:T.grey2}}>{c.id==="restauracao"?"Cozinhar mais. -100 EUR/mes.":c.id==="super"?"Lista semanal. Marcas brancas.":"Rever limite."}</div></div>)}</Card>
    <Card style={{marginBottom:12}}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><Ic d={ic.barChart} size={16}/><span style={{fontSize:14,fontWeight:700,textTransform:"uppercase"}}>PORTFOLIO</span></div><div style={{display:"flex",height:6,background:T.grey,marginBottom:8}}><div style={{width:`${eqP}%`,background:T.success}}/><div style={{width:`${fxP}%`,background:"#3B82F6"}}/><div style={{width:`${alP}%`,background:"#8B5CF6"}}/></div>
    {[{t:"AXON: Cortar perdas",c:T.signal,d:"Redistribuir para XTB Planos."},{t:"XTB Planos: Reforcar",c:T.success,d:"Meta: 200 EUR/mes."},{t:"TR Poupanca: Otimizar",c:"#3B82F6",d:"3.500 EUR emergencia, resto Rend.Fixo."},{t:"Credito: Nao amortizar",c:T.paper2,d:"Investimentos rendem +8%."}].map((r,i)=><div key={i} style={{padding:"12px 0",borderTop:`1px solid ${T.grey}`}}><div style={{fontFamily:T.mono,fontSize:11,color:r.c,marginBottom:4}}>{r.t}</div><div style={{fontSize:12,color:T.grey2}}>{r.d}</div></div>)}</Card>
    <Card><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><Ic d={ic.trophy} size={16}/><span style={{fontSize:14,fontWeight:700,textTransform:"uppercase"}}>CENARIOS 5 ANOS</span></div>{[{l:"SEM MUDANCAS",m:550,r:0.07},{l:"COM OTIMIZACAO",m:750,r:0.08},{l:"AGRESSIVO",m:1000,r:0.09}].map((s,i)=>{let v=tI;for(let m=0;m<60;m++)v=v*(1+s.r/12)+s.m;return<div key={i} style={{padding:"12px 0",borderTop:`1px solid ${T.grey}`,display:"flex",justifyContent:"space-between"}}><div><Label>{s.l}</Label><div style={{fontFamily:T.mono,fontSize:11,color:T.grey3,marginTop:2}}>{fmt(s.m)}/mes</div></div><div style={{textAlign:"right"}}><div style={{fontSize:20,fontWeight:900}}>{fmtK(v)}</div><div style={{fontFamily:T.mono,fontSize:10,color:T.success}}>+{fmtK(v-tI)}</div></div></div>;})}</Card></div>}

    {/* FORECAST */}
    {tab==="forecast"&&<div style={{padding:"0 20px 40px"}}><Card style={{marginBottom:12}}><Label style={{marginBottom:16}}>RECEITAS VS DESPESAS</Label>{yF.map((y,i)=><div key={y.year} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:T.mono,fontSize:12,fontWeight:600,color:i===0?T.paper:T.grey2}}>{y.year}</span><span style={{fontFamily:T.mono,fontSize:11,color:T.success}}>+{fmtK(y.savings)}</span></div><div style={{display:"flex",gap:4}}><div style={{flex:1}}><div style={{height:4,background:T.success,opacity:0.3+0.7*y.income/yF[4].income}}/></div><div style={{flex:1}}><div style={{height:4,background:T.signal,opacity:0.3+0.7*y.expenses/yF[4].expenses}}/></div></div></div>)}</Card>
    <Card style={{marginBottom:12}}><Label style={{marginBottom:16}}>XTB PROJECAO</Label>{xPr.map((p,i)=><div key={p.year} style={{display:"flex",justifyContent:"space-between",padding:"10px 0",borderTop:i>0?`1px solid ${T.grey}`:"none"}}><span style={{fontFamily:T.mono,fontSize:12}}>{p.year}</span><div><span style={{fontFamily:T.mono,fontSize:14,fontWeight:600}}>{fmtK(p.total)}</span><span style={{fontFamily:T.mono,fontSize:10,color:T.success,marginLeft:8}}>+{fmtK(p.total-xN)}</span></div></div>)}</Card>
    <Card><Label style={{marginBottom:16}}>INVESTIMENTOS TOTAIS</Label>{proj.map((p,i)=><div key={p.year} style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontFamily:T.mono,fontSize:12}}>{p.year}</span><span style={{fontFamily:T.mono,fontSize:12,fontWeight:600}}>{fmtK(p.total)}</span></div><div style={{height:4,background:T.grey}}><div style={{height:"100%",width:`${(p.total/proj[5].total)*100}%`,background:T.success}}/></div></div>)}</Card></div>}

    {/* LOAN */}
    {tab==="loan"&&<div style={{padding:"0 20px 40px"}}><Card signal style={{marginBottom:12}}><Label style={{marginBottom:6}}>CREDITO HABITACAO</Label><div style={{fontSize:13,color:T.grey2,marginBottom:16}}>Bankinter / Taxa Fixa</div><div style={{marginBottom:16}}><div style={{display:"flex",justifyContent:"space-between",fontFamily:T.mono,fontSize:11,color:T.grey2,marginBottom:6}}><span>Pago: {fmt(90000-77555.06)}</span><span>{pp.toFixed(1)}%</span></div><div style={{height:4,background:T.grey}}><div style={{height:"100%",width:`${pp}%`,background:T.success}}/></div></div><div style={{fontSize:28,fontWeight:900,color:T.signal}}>{fmt(77555.06)}</div><Label style={{marginTop:4}}>CAPITAL EM DIVIDA</Label></Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>{[["PRESTACAO","485,83 EUR"],["PROXIMA","28.05.2026"],["TAXA","2,7%"],["TIPO","TAXA FIXA"],["CAPITAL","90 000 EUR"],["PRAZO","20 ANOS"]].map(([l,v],i)=><Card key={i} style={{padding:"16px 20px"}}><Label style={{marginBottom:4}}>{l}</Label><div style={{fontSize:15,fontWeight:600}}>{v}</div></Card>)}</div></div>}

    {/* FOOTER */}
    <div style={{padding:"32px 20px 48px",borderTop:`1px solid ${T.grey}`}}><div style={{display:"flex",alignItems:"baseline"}}><span style={{fontWeight:900,fontSize:14}}>PROOF</span><span style={{fontWeight:900,fontSize:14,color:T.signal}}>.</span></div><div style={{fontFamily:T.mono,fontSize:9,color:T.grey3,letterSpacing:"0.1em",marginTop:4}}>CASE 001 / v0.6 / 2026.04.29</div></div>
  </div>);
}

/* ── ROOT ── */
function Root(){
  const[session,setSession]=useState(null);
  const[loading,setLoading]=useState(true);

  useEffect(()=>{
    supabase.auth.getSession().then(({data:{session}})=>{setSession(session);setLoading(false);});
    const{data:{subscription}}=supabase.auth.onAuthStateChange((_,session)=>{setSession(session);});
    return()=>subscription.unsubscribe();
  },[]);

  const handleLogout=async()=>{await supabase.auth.signOut();setSession(null);};

  if(loading)return<div style={{minHeight:"100vh",background:T.ink,display:"flex",alignItems:"center",justifyContent:"center"}}><Label>A CARREGAR.</Label></div>;
  if(!session)return<LoginScreen onLogin={setSession}/>;
  return<FinanceApp session={session} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
