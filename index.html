function chrt(data,color,label){
  var ht=56;if(!data||data.length<2)return"";
  var mn=Math.min.apply(null,data)*0.95,mx=Math.max.apply(null,data)*1.05,rg=mx-mn||1,w=100;
  var pts=data.map(function(v,i){return((i/(data.length-1))*w).toFixed(1)+","+((ht-((v-mn)/rg)*ht)).toFixed(1)}).join(" ");
  var ar=pts+" "+w+","+ht+" 0,"+ht;
  var df=data[data.length-1]-data[0],pc=data[0]>0?((df/data[0])*100).toFixed(1):"0";
  var dc=df>=0?"var(--success)":"var(--signal)";
  var id="g"+label.replace(/[^a-zA-Z]/g,"");
  var o='<div style="margin-bottom:16px">';
  o+='<div class="rw" style="margin-bottom:8px"><span style="font-size:13px;font-weight:500">'+e(label)+'</span>';
  o+='<div><span class="m" style="font-size:13px;font-weight:500">'+fm(data[data.length-1])+'</span>';
  o+='<span class="m" style="font-size:11px;color:'+dc+';margin-left:8px">'+(df>=0?"+":"")+pc+'%</span></div></div>';
  o+='<svg viewBox="0 0 '+w+' '+ht+'" style="width:100%;height:'+ht+'px;display:block">';
  o+='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity="0.15"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>';
  o+='<polygon points="'+ar+'" fill="url(#'+id+')"/>';
  o+='<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5"/>';
  data.forEach(function(v,i){o+='<circle cx="'+((i/(data.length-1))*w).toFixed(1)+'" cy="'+((ht-((v-mn)/rg)*ht)).toFixed(1)+'" r="2.5" fill="'+color+'" stroke="var(--bg2)" stroke-width="1"/>';});
  o+='</svg>';
  o+='<div style="display:flex;justify-content:space-between;margin-top:4px">';
  hist.forEach(function(x){o+='<span class="m" style="font-size:9px;color:var(--text3)">'+x.l+'</span>';});

}

/* ══ AI SCANNER ══ */
function resizeImg(file,maxW){
  maxW=maxW||1024;
  return new Promise(function(resolve){
    var img=new Image(),cnv=document.createElement("canvas"),rd=new FileReader();
    rd.onload=function(ev){img.onload=function(){var w=img.width,h=img.height;if(w>maxW){h=h*maxW/w;w=maxW;}cnv.width=w;cnv.height=h;cnv.getContext("2d").drawImage(img,0,0,w,h);resolve(cnv.toDataURL("image/jpeg",0.8).split(",")[1]);};img.src=ev.target.result;};
    rd.readAsDataURL(file);
  });
}
function readFileB64(file){
  return new Promise(function(resolve){
    var rd=new FileReader();
    rd.onload=function(ev){resolve(ev.target.result.split(",")[1]);};
    rd.readAsDataURL(file);
  });
}
function parseExcel(file){
  return new Promise(function(resolve){
    var rd=new FileReader();
    rd.onload=function(ev){
      try{
        var wb=XLSX.read(ev.target.result,{type:"array"});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var csv=XLSX.utils.sheet_to_csv(ws);
        resolve(csv);

function callAI(content,prompt,cb){
  if(!apiKey){cb({error:"API key nao configurada. Abre Definicoes."});return;}
  var msgs=[{role:"user",content:content.concat([{type:"text",text:prompt}])}];
  fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-beta":"pdfs-2024-09-25","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-3-5-sonnet-20241022",max_tokens:4000,system:"Responde APENAS JSON puro. Sem markdown, sem backticks.",messages:msgs})
  }).then(function(r){
    if(!r.ok) return r.text().then(function(body){throw new Error("API "+r.status+": "+body.substring(0,200));});
    return r.json();
  })
  .then(function(d){var txt=(d.content||[]).filter(function(i){return i.type==="text"}).map(function(i){return i.text}).join("");var m=txt.match(/\{[\s\S]*\}/);if(!m)throw new Error("Sem JSON.");cb(JSON.parse(m[0]));})
  .catch(function(err){
    var msg=err.message||"Erro desconhecido";
    if(msg==="Failed to fetch"||msg.indexOf("NetworkError")>-1||msg.indexOf("CORS")>-1)msg="Erro de rede/CORS. Testa a partir de HTTPS (GitHub Pages), nao de file://.";
    cb({error:msg});
  });
}

window.scanReceipt=function(el){
  var f=el.files&&el.files[0];if(!f)return;
  scScanning=true;scResult=null;render();
  resizeImg(f).then(function(b64){
    callAI([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}}],RCPT_PROMPT,function(res){
      scScanning=false;scResult=res;
      if(!res.error){
        if(res.total)addData.amount=String(res.total).replace(".",",");
        if(res.suggested_category)addData.cat=res.suggested_category;
        if(res.items&&res.items.length)addData.desc=res.items.map(function(i){return i.desc}).join(", ");
      }
      render();
    });
  });
};
window.scanStmt=function(el){
  var f=el.files&&el.files[0];if(!f)return;
  var name=f.name.toLowerCase();
  var isPDF=f.type==="application/pdf"||name.endsWith(".pdf");
  var isXLS=name.endsWith(".xlsx")||name.endsWith(".xls")||name.endsWith(".csv")||f.type.indexOf("spreadsheet")>-1||f.type.indexOf("excel")>-1;
  stScanning=true;stResult=null;stSel={};render();
  if(isPDF){
    readFileB64(f).then(function(b64){
      callAI([{type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}}],STMT_PROMPT,function(res){
        stScanning=false;stResult=res;
        if(res.transactions)res.transactions.forEach(function(t,i){if(t.amount<0)stSel[i]=true;});
        render();
      });
    });
  }else if(isXLS){
    parseExcel(f).then(function(csv){
      if(!csv){stScanning=false;stResult={error:"Erro ao ler ficheiro."};render();return;}
      callAI([{type:"text",text:"Dados do extracto bancario:\n\n"+csv}],STMT_PROMPT,function(res){
        stScanning=false;stResult=res;
        if(res.transactions)res.transactions.forEach(function(t,i){if(t.amount<0)stSel[i]=true;});
        render();
      });
    });
  }else{
    resizeImg(f,1600).then(function(b64){
      callAI([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}}],STMT_PROMPT,function(res){
        stScanning=false;stResult=res;
        if(res.transactions)res.transactions.forEach(function(t,i){if(t.amount<0)stSel[i]=true;});
        render();
      });
    });
  }
};
window.toggleStSel=function(i){if(stSel[i])delete stSel[i];else stSel[i]=true;render();};
window.doImportStmt=function(){
  if(!stResult||!stResult.transactions)return;
  stResult.transactions.forEach(function(t,i){
    if(!stSel[i])return;
    addedExp.push({desc:t.desc,amount:Math.abs(t.amount),cat:t.category||"out",date:t.date||""});
  });
  stResult=null;stSel={};showStmt=false;render();
};

    setTimeout(function(){var le=document.getElementById("le");if(le)le.addEventListener("keydown",function(ev){if(ev.key==="Enter")doLogin();});var lp=document.getElementById("lp");if(lp)lp.addEventListener("keydown",function(ev){if(ev.key==="Enter")doLogin();});},50);
    return;}

  var o='';
  // Header
  o+='<div class="rw" style="padding:20px 20px 0"><div><span style="font-weight:900;font-size:22px;letter-spacing:-0.03em">PROOF</span><span style="font-weight:900;font-size:22px;color:var(--signal)">.</span></div><div style="display:flex;align-items:center;gap:12px"><button onclick="showSet=true;render()" style="background:none;border:none;padding:4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="'+(apiKey?'var(--text3)':'var(--signal)')+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button><button onclick="doLogout()" style="background:none;border:none;color:var(--text3);font-family:var(--mono);font-size:10px;letter-spacing:0.1em">SAIR</button><div class="lb">29.04.2026</div></div></div>';
  // Net Worth
  o+='<div style="padding:28px 20px 8px"><div class="lb" style="margin-bottom:8px">PATRIMONIO LIQUIDO</div>';
  o+='<div style="font-size:36px;font-weight:900;letter-spacing:-0.04em">'+fm(nW)+'</div>';
  o+='<div style="display:flex;align-items:center;gap:6px;margin-top:8px"><span class="m" style="font-size:12px;color:'+(aD>=0?'var(--success)':'var(--signal)')+'">'+(aD>=0?'+':'')+fm(Math.abs(aD))+'</span><span class="m" style="font-size:11px;color:var(--text3)">desde 11.04</span></div></div>';
  // Asset Bar
  o+='<div style="padding:12px 20px 16px"><div style="display:flex;height:4px;background:var(--border)">';
  Object.keys(cT).forEach(function(c){o+='<div style="width:'+(cT[c]/tA*100)+'%;background:'+(cCol[c]||'#8A8E99')+'"></div>';});
  o+='</div></div>';
  // Tabs
  var tabs=[["overview","RESUMO"],["charts","GRAFICOS"],["expenses","DESPESAS"],["loan","CREDITO"]];
  o+='<div class="tab-bar">';
  tabs.forEach(function(t){o+='<button class="tb'+(tab===t[0]?' on':'')+'" onclick="T(\'tab\',\''+t[0]+'\')">'+t[1]+'</button>';});
  o+='</div>';
  // Content
  if(tab==="overview")o+=rOverview();
  else if(tab==="charts")o+=rCharts();
  else if(tab==="expenses")o+=rExpenses();
  else if(tab==="loan")o+=rLoan();
  // Footer
  o+='<div style="padding:32px 20px 48px;border-top:1px solid var(--border)"><div><span style="font-weight:900;font-size:14px">PROOF</span><span style="font-weight:900;font-size:14px;color:var(--signal)">.</span></div><div class="m" style="font-size:9px;color:var(--text3);letter-spacing:0.1em;margin-top:4px">CASE 001 / v1.0 / 2026.04.29</div></div>';

  // Modals
  if(showSet)o+=rSettings();
  if(showAdd)o+=rAddExp();
  if(showStmt)o+=rStatement();

  el.innerHTML=o;
}

/* ══ GLOBAL STATE HANDLER ══ */
window.render=render;
window.T=function(key,val){
  if(val==="null")val=null;
  if(key==="em")val=parseInt(val);
  if(key==="tab"){tab=val;xCat=null;xExp=null;}
  else if(key==="xCat"){xCat=val;xExp=null;}
  else if(key==="xExp"){xExp=val;}
  else if(key==="em"){em=val;xExp=null;}
  else if(key==="showSet"){showSet=!!val;}
  else if(key==="showStmt"){showStmt=!!val;if(!val){stResult=null;stSel={};}}
  else if(key==="showAdd"){showAdd=!!val;if(!val)scResult=null;}
  render();
};

/* ══ INIT ══ */
if(sb){
  render();
  sb.auth.getSession().then(function(res){
    view=res.data.session?"app":"login";
    render();
  });
  sb.auth.onAuthStateChange(function(_,sess){view=sess?"app":"login";render();});
}else{
  view="app";render();
}
</script>
